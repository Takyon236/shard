# Shard GitHub Action
#
# Customer workflow guidance lives in README.md and docs/. This manifest is the machine interface:
# each field states its purpose, accepted values, default and the one caveat needed to use it safely.
# **THE MARKETPLACE NAME, AND IT IS NOT "Shard" BECAUSE IT CANNOT BE.** GitHub refuses a listing
# whose name matches an existing user or organisation, and `github.com/Shard` is a user account held
# by somebody else — measured 2026-09-08, when the listing was refused. The rule is independent of
# whether any Action is listed under that name: `/marketplace/actions/shard` is a 404 and the name is
# still unavailable, so probing the listing URL proves nothing and was the check that missed this.
#
# An account name cannot contain a space, so any multi-word name sidesteps the collision outright.
# `github.com/reyse` is taken as well, which rules out a bare vendor name by the same rule.
#
# **THIS IS A DISPLAY STRING ONLY.** It titles the Marketplace listing and labels the step in a run
# log. `uses: <owner>/<name>@<ref>` resolves by REPOSITORY PATH and is unaffected, so no customer
# workflow changes. The SARIF tool driver is a different string — `report.TOOL_NAME` — and stays
# `Shard`, because that one identifies the tool to a code-scanning consumer and renaming it would
# break alert continuity for every repository already ingesting our output.
name: "Shard Security Review"
description: "Security review with reproducing inputs, on your runner and model endpoint."
author: "Reyse"

# REQUIRED FOR A MARKETPLACE LISTING, and for nothing else. GitHub refuses to publish an Action
# whose manifest has no `branding`, and the two keys are a closed vocabulary: the icon is one of the
# Feather names GitHub allows and the colour is one of eight. `shield` and `blue` say "security
# tool" in a browse list where the description is truncated; they are a presentation choice and
# changing them alters no behaviour.
branding:
  icon: "shield"
  color: "blue"

inputs:
  mode:
    description: "Free image mode: survey or diff."
    required: false
    default: "diff"

  model_endpoint:
    description: >
      Streaming OpenAI-compatible base URL. Every request uses stream: true and native tool calls.
      Run preflight --probe-endpoint before a review. Survey refuses model_endpoint because it makes
      no inference request.
    required: false

  model:
    description: "Exact model identifier served by the endpoint."
    required: false
    default: "glm-5.2"

  api_key_env:
    description: >
      Name of the environment variable containing the endpoint key; never put the key itself in with:.
      The launcher copies its value to a fixed internal carrier; the selected name is never forwarded
      into the image. Survey does not read this default because it makes no inference request.
    required: false
    default: "OPENROUTER_API_KEY"

  max_spend_usd:
    description: >
      Observed inference-cost ceiling. 0 disables it. Use 0 when a self-hosted endpoint reports no
      dollar price; token, time and step limits remain available.
    required: false
    default: "10"

  max_minutes:
    description: "Review-loop wall-clock ceiling. 0 disables it."
    required: false
    default: "60"

  max_tokens:
    description: >
      Explicit token ceiling for diff mode. 0 means no token ceiling.
    required: false
    default: "0"

  scan:
    description: >
      Budget profile: initial or followup. It changes ceilings, not diff scope.

      Survey refuses scan because a survey has no model budget to size.
    required: false

  max_steps:
    description: >
      Maximum model turns in diff mode. When omitted, the measured default applies; a scan profile can
      raise that floor. 0 is invalid.


      Survey refuses max_steps because a survey takes no model turns.
    required: false

  hunk_radius:
    description: >
      Diff attention window in lines around each changed line. 0 uses whole changed files.

      Survey refuses hunk_radius because a survey reads no diff.
    required: false

  witness_entry:
    description: >
      Repository-relative executable used to demonstrate findings. Shard calls it from the repository
      root with the payload file path in $1; stdin carries nothing. Without a witness, hypotheses can
      be reported but cannot gate. Put benign controls in ENTRY.benign/.
    required: false

  base_ref:
    description: >
      Diff base, default HEAD~1. The checkout must contain it. Use fetch-depth: 0 when supplying a
      revision; otherwise Git may answer fatal: bad object and the run can have no changed files.
    required: false
    default: "HEAD~1"

  state_repo:
    description: >
      Optional checked-out dedicated state repository for diff mode. State failure never fails the
      reviewed build.

      Survey refuses state_repo because a survey writes no cross-run state.
    required: false

  slug:
    description: "owner/name attributed in reports and delivery."
    required: false

  fail_on:
    description: >
      none (default) | reproduced | new. Hypotheses never gate. New additionally requires evidence
      that the change introduced the demonstrated defect.


      Survey accepts fail_on but cannot gate; the run reports that consequence.
    required: false
    default: "none"

  out_dir:
    description: >
      Fresh workspace-relative directory. Diff writes shard-report.md, shard-result.json, shard.sarif,
      optional shard-telemetry.json and shard-run.log, and bundles/ when a finding bundle is written. Survey
      writes shard-report.md and shard-survey.json. The Action refuses absolute paths, parent traversal,
      symlinks and a non-empty destination. Each path component may contain only ASCII letters, digits,
      dot, underscore and hyphen; use a distinct directory for each Shard step in one job.
    required: false
    default: "shard-out"

  github_token:
    description: >
      Optional GitHub token for pull-request comments and SARIF delivery. Requires pull-requests:
      write and security-events: write. It is used for delivery and never forwarded to the scanner CLI.
    required: false
    default: ""

outputs:
  status:
    description: |
        done      review finished
        error     endpoint or review failed
        budget    a configured ceiling stopped the review
        maxsteps  the review ran out of turns
        repeat    repeated identical tool calls stopped the review
    value: ${{ steps.shard.outputs['status'] }}

  findings:
    description: "Number of findings emitted."
    value: ${{ steps.shard.outputs['findings'] }}

  gate-eligible:
    description: >
      Number of demonstrated findings. With fail_on: new, change attribution is recorded in
      shard-result.json and exit 1 remains the authoritative gate result.
    value: ${{ steps.shard.outputs['gate-eligible'] }}

  sarif-path:
    description: "Path to SARIF for code scanning."
    value: ${{ steps.shard.outputs['sarif-path'] }}

  report-path:
    description: "Path to the Markdown report."
    value: ${{ steps.shard.outputs['report-path'] }}

  bundle-path:
    description: >
      Path to finding bundles; empty when none were written. Inspect the reproduced field in each
      bundle's metadata.json to distinguish a demonstration from a candidate whose witness did not
      demonstrate the finding.
    value: ${{ steps.shard.outputs['bundle-path'] }}

  result-path:
    description: "Path to the versioned machine-readable result."
    value: ${{ steps.shard.outputs['result-path'] }}

  telemetry-path:
    description: "Path to source-free structured run metrics, when written."
    value: ${{ steps.shard.outputs['telemetry-path'] }}

  log-path:
    description: "Path to the human-readable run timeline, when written."
    value: ${{ steps.shard.outputs['log-path'] }}

runs:
  using: "composite"
  steps:
    - id: shard
      name: "Run Shard in its contained image"
      shell: bash
      env:
# THIS ACTION RUNS A PUBLISHED IMAGE. `SHARD_ACTION_IMAGE` below names one exact artefact by
# digest, so
# GitHub PULLS it instead of building 934 MB on your runner at the start of every job. The
# `Dockerfile` beside this file still ships and still builds the same image: it is what you
# read to audit what executes in your pipeline, and what you build if you would rather run
# your own. The build-context paragraph above applies to that path rather than to this one.
        SHARD_ACTION_IMAGE: "docker://ghcr.io/takyon236/shard@sha256:2c9ee936c7fd28d22a1302aa186c65f1c6387ec5c02493533188716fc94a90e3"
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_MODEL_ENDPOINT: ${{ inputs.model_endpoint }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_API_KEY_ENV: ${{ inputs.api_key_env }}
        INPUT_MAX_SPEND_USD: ${{ inputs.max_spend_usd }}
        INPUT_MAX_MINUTES: ${{ inputs.max_minutes }}
        INPUT_MAX_TOKENS: ${{ inputs.max_tokens }}
        INPUT_SCAN: ${{ inputs.scan }}
        INPUT_MAX_STEPS: ${{ inputs.max_steps }}
        INPUT_HUNK_RADIUS: ${{ inputs.hunk_radius }}
        INPUT_WITNESS_ENTRY: ${{ inputs.witness_entry }}
        INPUT_BASE_REF: ${{ inputs.base_ref }}
        INPUT_STATE_REPO: ${{ inputs.state_repo }}
        INPUT_SLUG: ${{ inputs.slug }}
        INPUT_FAIL_ON: ${{ inputs.fail_on }}
        INPUT_OUT_DIR: ${{ inputs.out_dir }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail

        if [[ "${RUNNER_OS:-Linux}" != "Linux" ]]; then
          echo "shard: the contained Action requires a Linux runner" >&2
          exit 2
        fi
        if ! command -v docker >/dev/null 2>&1; then
          echo "shard: Docker is required to launch the contained Action image" >&2
          exit 2
        fi

        image_spec="$SHARD_ACTION_IMAGE"
        if [[ "$image_spec" == "Dockerfile" ]]; then
          image="shard-action-local:${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}-${RANDOM}"
          docker build --file "$GITHUB_ACTION_PATH/Dockerfile" --tag "$image" "$GITHUB_ACTION_PATH"
        elif [[ "$image_spec" == docker://* ]]; then
          image="${image_spec#docker://}"
        else
          echo "shard: action image must be Dockerfile or a docker:// digest reference" >&2
          exit 2
        fi

        host_workspace="${GITHUB_WORKSPACE:?shard: GITHUB_WORKSPACE is required}"
        host_workspace="$(realpath -e -- "$host_workspace")"
        host_uid="$(id -u)"
        host_gid="$(id -g)"
        if [[ ! "$host_uid" =~ ^[0-9]+$ || ! "$host_gid" =~ ^[0-9]+$ ]]; then
          echo "shard: runner uid/gid could not be represented for the output relay" >&2
          exit 2
        fi
        handoff_key="$(od -An -N32 -tx1 /dev/urandom | tr -d '[:space:]')"
        if [[ ! "$handoff_key" =~ ^[0-9a-f]{64}$ ]]; then
          echo "shard: a 256-bit Action handoff key could not be generated" >&2
          exit 2
        fi
        # THE THREE CAPABILITIES THE BOUNDARY NEEDS, AND `SYS_ADMIN` ALONE WAS NEVER ENOUGH.
        # Measured 2026-09-06 inside this image, `witness.isolation_prefix` under exactly these
        # flags, one capability at a time:
        #
        #   --cap-drop ALL --cap-add SYS_ADMIN   `could not mount a private writable trial: errno 13`
        #   + DAC_OVERRIDE                       `could not lock root capability semantics: errno 1`
        #   + SETPCAP                            demonstrated: exit 139, benign control ran
        #
        # So every witness execution in the shipped image refused before this line changed, and the
        # product reported hypotheses it could have proved. `prctl(PR_SET_SECUREBITS)` has always
        # required CAP_SETPCAP, so this was never a property of one kernel.
        #
        # THIS DOES NOT WIDEN WHAT CUSTOMER CODE HOLDS. The namespace initializer needs them only to
        # build the mounts; it then drops the bounding set, clears every capability set and sets
        # no_new_privs BEFORE it execs the entry point — and it is the SETPCAP grant that lets it do
        # so. Without SETPCAP the hardening cannot run, which is why the probe refuses rather than
        # executing anything.
        docker_args=(
          run --rm --interactive
          --cap-drop ALL --cap-add SYS_ADMIN --cap-add DAC_OVERRIDE --cap-add SETPCAP
          --group-add "$host_gid"
          --security-opt seccomp=unconfined
          --security-opt apparmor=unconfined
          --volume "$host_workspace:/github/workspace"
          --workdir /github/workspace
          --env GITHUB_WORKSPACE=/github/workspace
          --env RUNNER_TEMP=/tmp
          --env GIT_CONFIG_COUNT=1
          --env GIT_CONFIG_KEY_0=safe.directory
          --env GIT_CONFIG_VALUE_0=/github/workspace
          --env SHARD_ACTION_HANDOFF=1
        )

        input_names=(
          INPUT_MODE INPUT_MODEL_ENDPOINT INPUT_MODEL INPUT_MAX_SPEND_USD
          INPUT_MAX_MINUTES INPUT_MAX_TOKENS INPUT_SCAN INPUT_MAX_STEPS INPUT_HUNK_RADIUS
          INPUT_WITNESS_ENTRY
          INPUT_BASE_REF INPUT_STATE_REPO INPUT_SLUG INPUT_FAIL_ON INPUT_OUT_DIR
          INPUT_GITHUB_TOKEN
        )
        for name in "${input_names[@]}"; do
          docker_args+=(--env "$name")
        done

        key_name="${INPUT_API_KEY_ENV:-OPENROUTER_API_KEY}"
        if [[ ! "$key_name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
          echo "shard: api_key_env must name an environment variable" >&2
          exit 2
        fi
        case "$key_name" in
          SHARD_ID_"TOKEN"|INPUT_ID_"TOKEN"|INPUT_GITHUB_"TOKEN"|GITHUB_"TOKEN"|ACTIONS_*)
            echo "shard: api_key_env names a reserved Action credential" >&2
            exit 2
            ;;
        esac
        # The caller-selected name is DATA inside the image, never an environment selector. Passing
        # it directly let PYTHONPATH, LD_PRELOAD or PATH replace the trusted entrypoint before it read
        # the handoff key. The fixed carrier is not interpreted by Python or the dynamic loader.
        docker_args+=(--env "INPUT_API_KEY_ENV=$key_name")
        if [[ -n "${!key_name+x}" ]]; then
          export SHARD_ACTION_MODEL_API_KEY="${!key_name}"
          docker_args+=(--env SHARD_ACTION_MODEL_API_KEY)
        fi


        github_names=(
          GITHUB_API_URL GITHUB_EVENT_NAME GITHUB_REF GITHUB_REPOSITORY GITHUB_REPOSITORY_ID
          GITHUB_RUN_ATTEMPT GITHUB_RUN_ID GITHUB_RUN_NUMBER GITHUB_SHA
        )
        for name in "${github_names[@]}"; do
          if [[ -n "${!name+x}" ]]; then
            docker_args+=(--env "$name")
          fi
        done

        requested_out="${INPUT_OUT_DIR:-shard-out}"
        if [[ ! "$requested_out" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]]; then
          echo "shard: out_dir must be a workspace-relative path of ordinary path components" >&2
          exit 2
        fi
        case "/$requested_out/" in
          */../*|*/./*)
            echo "shard: out_dir may not contain '.' or '..' components" >&2
            exit 2
            ;;
        esac
        host_out="$host_workspace"
        IFS='/' read -r -a out_parts <<< "$requested_out"
        for part in "${out_parts[@]}"; do
          candidate="$host_out/$part"
          if [[ -L "$candidate" ]]; then
            echo "shard: out_dir crosses a symlink in the checkout: $requested_out" >&2
            exit 2
          fi
          if [[ -e "$candidate" && ! -d "$candidate" ]]; then
            echo "shard: out_dir crosses a non-directory in the checkout: $requested_out" >&2
            exit 2
          fi
          host_out="$candidate"
        done
        mkdir -p -- "$host_out"
        resolved_out="$(realpath -e -- "$host_out")"
        if [[ "$resolved_out" != "$host_workspace/"* ]]; then
          echo "shard: out_dir resolves outside the checkout: $requested_out" >&2
          exit 2
        fi
        if [[ -n "$(find -P "$host_out" -mindepth 1 -print -quit)" ]]; then
          echo "shard: out_dir is not empty; refusing to mix this run with older evidence" >&2
          exit 2
        fi
        chgrp "$host_gid" "$host_out"
        chmod 0770 "$host_out"

        host_temp="$(realpath -e -- "${RUNNER_TEMP:-/tmp}")"
        publication_root="$(mktemp -d "$host_temp/shard-action-publish.XXXXXX")"
        chgrp "$host_gid" "$publication_root"
        chmod 0770 "$publication_root"
        resolved_publication_root="$(realpath -e -- "$publication_root")"
        docker_args+=(--volume "$host_out:/github/workspace/$requested_out")
        # `actionsnapshot` republishes descriptor-validated bytes before exposing their paths. This
        # dedicated host directory is mounted at the IDENTICAL absolute path, so a later runner step
        # can open every declared output without exposing the rest of RUNNER_TEMP to customer code.
        docker_args+=(--volume "$publication_root:$publication_root")
        docker_args+=(--env "SHARD_ACTION_SNAPSHOT_ROOT=$publication_root")

        relay_root="$(mktemp -d /tmp/shard-relay.XXXXXX)"
        cleanup_relay() {
          if [[ "$relay_root" != /tmp/shard-relay.?????? ]]; then
            echo "shard: refusing to remove an unexpected relay path: $relay_root" >&2
            return
          fi
          command rm -rf -- "$relay_root"
        }
        trap cleanup_relay EXIT
        # The reviewing container only appends to two files created below. Directory write authority
        # is unnecessary on a rootful daemon; rootless container root remains the host owner, so the
        # keyed manifest — not this mode — is the authority against replacement.
        chmod 0710 "$relay_root"
        docker_args+=(--volume "$relay_root:/github/file-commands")
        relay_files=()
        relay_identities=()
        output_relay=""
        if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
          output_relay="$relay_root/output"
          : > "$output_relay"
          chmod 0620 "$output_relay"
          relay_files+=("$output_relay")
          relay_identities+=("$(stat -c '%d:%i:%u:%g:%h:%f' -- "$output_relay")")
          docker_args+=(--env GITHUB_OUTPUT=/github/file-commands/output)
        fi
        summary_relay=""
        if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          summary_relay="$relay_root/summary"
          : > "$summary_relay"
          chmod 0620 "$summary_relay"
          relay_files+=("$summary_relay")
          relay_identities+=("$(stat -c '%d:%i:%u:%g:%h:%f' -- "$summary_relay")")
          docker_args+=(--env GITHUB_STEP_SUMMARY=/github/file-commands/summary)
        fi
        relay_root_identity="$(stat -c '%d:%i:%u:%g:%h:%f:%Y:%Z' -- "$relay_root")"
        # The key crosses stdin before any repository process starts. It is intentionally absent from
        # argv and the environment: Linux can retain an unset initial environment value in /proc.
        if printf '%s\n' "$handoff_key" | docker "${docker_args[@]}" "$image" action; then
          shard_status=0
        else
          shard_status=$?
        fi
        unset SHARD_ACTION_MODEL_API_KEY
        verify_handoff() {
          local emit="${1:-}"
          local verify_args=(
            run --rm --interactive --network none
            --cap-drop ALL --security-opt no-new-privileges
            --group-add "$host_gid"
            --volume "$publication_root:/shard-publish:ro"
            --volume "$relay_root:/shard-relay:ro"
            --entrypoint python "$image" -m shard.actionhandoff
            /shard-publish /shard-relay
          )
          if [[ -n "$emit" ]]; then
            verify_args+=(--emit "$emit")
          fi
          printf '%s\n' "$handoff_key" | docker "${verify_args[@]}"
        }
        ownership_status=0
        # Docker has reaped the reviewing container and its descendants before this path transition.
        # Validate EVERY relay identity first: chmod follows a path and must never touch a substituted
        # symlink or hard link. The HMAC remains authoritative for expected in-place byte changes.
        if [[ -L "$relay_root" || ! -d "$relay_root" \
              || "$(stat -c '%d:%i:%u:%g:%h:%f:%Y:%Z' -- "$relay_root")" \
                 != "$relay_root_identity" ]]; then
          echo "shard: the command-file relay directory was replaced while the contained run executed" >&2
          ownership_status=1
        else
          for index in "${!relay_files[@]}"; do
            relay_file="${relay_files[$index]}"
            if [[ -L "$relay_file" || ! -f "$relay_file" \
                  || "$(stat -c '%d:%i:%u:%g:%h:%f' -- "$relay_file")" \
                     != "${relay_identities[$index]}" ]]; then
              echo "shard: a command-file relay was replaced while the contained run executed" >&2
              ownership_status=1
            fi
          done
        fi
        if [[ "$ownership_status" == 0 ]]; then
          for relay_file in "${relay_files[@]}"; do
            if ! chmod 0640 "$relay_file"; then
              echo "shard: a command-file relay could not be opened for verification" >&2
              ownership_status=1
            fi
          done
          if [[ "$ownership_status" == 0 ]] && ! chmod 0750 "$relay_root"; then
            echo "shard: the command-file relay could not be opened for verification" >&2
            ownership_status=1
          fi
        fi
        if [[ "$ownership_status" != 0 ]]; then
          :
        elif [[ -L "$host_out" || ! -d "$host_out" \
              || "$(realpath -e -- "$host_out")" != "$resolved_out" \
              || "$(stat -c '%u:%g' -- "$host_out")" != "$host_uid:$host_gid" ]]; then
          echo "shard: the host out_dir was replaced while the contained run executed" >&2
          ownership_status=1
        elif [[ -L "$publication_root" || ! -d "$publication_root" \
              || "$(realpath -e -- "$publication_root")" != "$resolved_publication_root" \
              || "$(stat -c '%u:%g' -- "$publication_root")" != "$host_uid:$host_gid" ]]; then
          echo "shard: the publication directory was replaced while the contained run executed" >&2
          ownership_status=1
        # The reviewing container and every descriptor it retained are gone now. This second container
        # gets read-only mounts and authenticates the exact snapshots and GitHub command-file bytes
        # before one byte is chowned or relayed to a later workflow step.
        elif ! verify_handoff; then
          echo "shard: the contained run's authenticated handoff failed; no outputs were forwarded" >&2
          ownership_status=1
        elif ! docker run --rm --network none --cap-drop ALL --cap-add CHOWN \
            --security-opt no-new-privileges --group-add "$host_gid" \
            --volume "$host_out:/shard-output" \
            --volume "$publication_root:/shard-publish" \
            --entrypoint sh "$image" -c '
              set -eu
              bad="$(find -P /shard-output /shard-publish -xdev -mindepth 1 \
                ! -type d ! -type f -print -quit)"
              if [ -n "$bad" ]; then
                echo "shard: output relay contains a non-file artefact" >&2
                find -P /shard-output /shard-publish -xdev -depth -mindepth 1 -delete
                exit 1
              fi
              bad="$(find -P /shard-output /shard-publish -xdev -type f \
                ! -links 1 -print -quit)"
              if [ -n "$bad" ]; then
                echo "shard: output relay contains a multiply-linked artefact" >&2
                find -P /shard-output /shard-publish -xdev -depth -mindepth 1 -delete
                exit 1
              fi
              # The first read-only verifier has authenticated every byte and the reviewing container
              # is gone. Preserve executable bits while making those same files readable after they
              # return to the runner owner/group for the authenticated relay reads below.
              find -P /shard-output /shard-publish -xdev -mindepth 1 -type d \
                -exec chmod g+rx -- {} +
              find -P /shard-output /shard-publish -xdev -mindepth 1 -type f \
                -exec chmod g+r -- {} +
              output_uid="$(stat -c "%u" -- /shard-output)"
              output_gid="$(stat -c "%g" -- /shard-output)"
              publish_uid="$(stat -c "%u" -- /shard-publish)"
              publish_gid="$(stat -c "%g" -- /shard-publish)"
              for owner in "$output_uid" "$output_gid" "$publish_uid" "$publish_gid"; do
                case "$owner" in ""|*[!0-9]*) exit 1 ;; esac
              done
              chown -R --no-dereference -- "$output_uid:$output_gid" /shard-output
              chown -R --no-dereference -- "$publish_uid:$publish_gid" /shard-publish
            '; then
          ownership_status=1
        fi
        if [[ "$ownership_status" == 0 ]]; then
          if ! bad_owner="$(find -P "$host_out" "$publication_root" -xdev \
              \( ! -uid "$host_uid" -o ! -gid "$host_gid" \) -print -quit)"; then
            echo "shard: runner ownership of the output relay could not be verified" >&2
            ownership_status=1
          elif [[ -n "$bad_owner" ]]; then
            echo "shard: output relay ownership did not return to the runner: $bad_owner" >&2
            ownership_status=1
          elif ! unreadable="$(find -P "$host_out" "$publication_root" -xdev \
              \( -type d ! -perm -u=rx -o -type f ! -perm -u=r \) -print -quit)"; then
            echo "shard: runner readability of the output relay could not be verified" >&2
            ownership_status=1
          elif [[ -n "$unreadable" ]]; then
            echo "shard: output relay is not readable by the runner: $unreadable" >&2
            ownership_status=1
          fi
        fi
        if [[ "$ownership_status" != 0 ]]; then
          shard_status=2
        fi
        relay_status=0
        if [[ "$ownership_status" == 0 ]]; then
          if [[ -n "$output_relay" ]]; then
            if ! verify_handoff output >> "$GITHUB_OUTPUT"; then
              echo "shard: authenticated outputs could not reach $GITHUB_OUTPUT" >&2
              relay_status=1
            fi
          fi
          if [[ -n "$summary_relay" ]]; then
            if ! verify_handoff summary >> "$GITHUB_STEP_SUMMARY"; then
              echo "shard: authenticated summary could not reach $GITHUB_STEP_SUMMARY" >&2
              relay_status=1
            fi
          fi
        fi
        unset handoff_key
        if [[ "$relay_status" != 0 ]]; then
          shard_status=2
        fi
        exit "$shard_status"
