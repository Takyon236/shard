# The published repository's own CI.
#
# Runs on every push and every pull request, including pull requests from forks.
# Nothing here needs a secret, and that is deliberate rather than incidental: the
# whole test suite runs with no API key and no network, so an outside
# contributor's first pull request gets a real green check without a maintainer
# having to approve a workflow run that could read credentials.
#
# `permissions: contents: read` and no secrets means a fork pull request cannot
# reach anything. `pull_request` (not `pull_request_target`) runs the fork's code
# against the fork's own permissions, which is the safe direction.
#
# EVERY ACTION IS PINNED BY COMMIT, INCLUDING GITHUB'S OWN. `contents: read` bounds the TOKEN, not
# the process: `setup-python` runs arbitrary Node on the runner before `pytest` does, so a repointed
# tag rewrites the checkout and this file's green tick then attests a tree that was never tested.
# The `actions/*` namespace was exempt from the gate until 2026-09-02 on the argument that it is
# GitHub's own; the argument is about the token and this is not. The exact version stays in a
# trailing comment so a reader knows WHAT is pinned and a bot can propose the bump.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is the version the action's own image ships. The ceiling
        # catches a deprecation before a runner image upgrade does it for us.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # No API key, no network. If a test here needs either, it is the test that
      # is wrong — see CONTRIBUTING.md.
      - name: Tests
        run: python -m pytest

      - name: Lint
        run: python -m ruff check shard/

  image:
    # THE ARTEFACT A USER ACTUALLY PULLS. The suite above tests the source; this
    # builds the container the action runs, and then drives it the way GitHub
    # does — `args: [action]`, `INPUT_*` in the environment, the workspace
    # mounted. Every input-mapping defect this project has had lived in the gap
    # between those two things.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build
        # **A CONTRIBUTOR'S PULL REQUEST MUST NOT GO RED BECAUSE A REGISTRY HAD A BAD MINUTE.**
        # Measured on `main`, 2026-08-25: this step failed in 36 seconds with
        # `failed to fetch oauth token: POST https://auth.docker.io/token: 500 Internal Server
        # Error` — both base images, before a single layer was built. The identical commit had
        # passed on a pull request thirteen seconds earlier, and a plain re-run went green.
        #
        # It is not a one-off to wait out, either: these are ANONYMOUS pulls, and Docker Hub rate
        # limits those per IP while GitHub-hosted runners share addresses. So the failure mode is
        # recurring and belongs to the network rather than to the change under test.
        #
        # This repository's whole invitation to contribute rests on that check meaning something.
        # A red tick a contributor cannot explain and did not cause teaches them to ignore it,
        # which costs more than the outage did.
        #
        # THREE ATTEMPTS, WIDENING GAPS, AND STILL A FAILURE AT THE END. The retry loop exits
        # non-zero if the last attempt fails, so a genuinely broken Dockerfile fails exactly as it
        # did before — this buys tolerance for a transient, never silence about a real defect.
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker build -t shard:ci .; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::docker build failed on attempt ${attempt}/3 — retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
            fi
          done
          echo "::error::docker build failed three times; this is the image, not the registry"
          exit 1

      - name: Smoke-test through the real entry point
        run: |
          set -euo pipefail
          mkdir -p ws && printf 'def f(x):\n    return eval(x)\n' > ws/app.py
          docker run --rm \
            -v "$PWD/ws:/github/workspace" -w /github/workspace \
            -e INPUT_MODE=survey -e INPUT_OUT_DIR=/tmp/out \
            shard:ci action

      # A REAL WITNESS EXECUTION, INSIDE THE IMAGE, UNDER THE FLAGS `action.yml` USES.
      #
      # The smoke test above runs `survey`, which makes no inference request and executes no witness
      # — so nothing in this workflow had ever proved the one thing a finding rests on: that the
      # image can build its execution boundary on a hosted runner and demonstrate a defect inside it.
      #
      # It could not. Measured 2026-09-06 in the image, `--cap-drop ALL --cap-add SYS_ADMIN` alone:
      # the boundary probe returned nothing, so `adjudicate` refused every execution and every
      # finding the product could have proved was reported as an unproven hypothesis. Adding
      # DAC_OVERRIDE (the private writable trial is an overlay mount) and SETPCAP (the initializer
      # locks securebits before the entry point starts) made the same script demonstrate: exit 139,
      # with the benign control run.
      #
      # THE FLAGS BELOW MUST STAY BYTE-FOR-BYTE WHAT `action.yml` PASSES. A check with a wider grant
      # than the product uses proves the kernel can contain and says nothing about the shipped
      # configuration, which is the gap this step exists to close. The runner's own suite SKIPS these
      # verdicts, by design and by name; this step is where they are actually measured, and it cannot
      # skip.
      - name: A witness demonstrates inside the image, with the Action's own capabilities
        run: |
          set -euo pipefail
          mkdir -p wit/.shard
          printf '#!/bin/sh\nif grep -q BOOM "$1" 2>/dev/null; then kill -SEGV $$; fi\necho fine\n' \
            > wit/.shard/entry.sh
          chmod 0755 wit/.shard/entry.sh
          cat > check.py <<'PY'
          import pathlib
          from shard.witness import (WitnessSpec, adjudicate, containment_unavailable,
                                     entry_digest)

          gap = containment_unavailable()
          if gap:
              raise SystemExit("the image cannot contain execution under the Action's own "
                               "capabilities, so no finding it reports could ever gate: " + gap)
          repo, entry = pathlib.Path("/repo"), ".shard/entry.sh"
          got = adjudicate(WitnessSpec(entry=entry, expectation="fatal_signal", payload=b"BOOM"),
                           repo, baseline_digest=entry_digest(repo, entry), timeout=120)
          print("demonstrated", got.demonstrated, "exit", got.exit_code,
                "controls", got.controls, "refusal", repr(got.refusal))
          if not (got.demonstrated and got.exit_code == 139 and got.controls):
              raise SystemExit("a real witness did not demonstrate inside the image")
          # THE NON-VACUITY ARM. A boundary that crashed everything would satisfy the line above.
          benign = adjudicate(WitnessSpec(entry=entry, expectation="fatal_signal", payload=b"calm"),
                              repo, baseline_digest=entry_digest(repo, entry), timeout=120)
          print("benign demonstrated", benign.demonstrated, "refusal", repr(benign.refusal))
          if benign.demonstrated or benign.refusal:
              raise SystemExit("an ordinary input was not clean inside the image")
          PY
          docker run --rm \
            --cap-drop ALL --cap-add SYS_ADMIN --cap-add DAC_OVERRIDE --cap-add SETPCAP \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -v "$PWD/wit:/repo" -v "$PWD/check.py:/check.py:ro" \
            --entrypoint python shard:ci /check.py
