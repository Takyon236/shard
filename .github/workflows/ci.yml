# The published repository's own CI.
#
# Runs on every push and every pull request, including pull requests from forks.
# Nothing here needs a secret, and that is deliberate rather than incidental: the
# whole test suite runs with no API key and no network, so an outside
# contributor's first pull request gets a real green check without a maintainer
# having to approve a workflow run that could read credentials.
#
# `permissions: contents: read` and no secrets means a fork pull request cannot
# reach anything. `pull_request` (not `pull_request_target`) runs the fork's code
# against the fork's own permissions, which is the safe direction.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is the version the action's own image ships. The ceiling
        # catches a deprecation before a runner image upgrade does it for us.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # No API key, no network. If a test here needs either, it is the test that
      # is wrong — see CONTRIBUTING.md.
      - name: Tests
        run: python -m pytest -q

      - name: Lint
        run: python -m ruff check shard/

  image:
    # THE ARTEFACT A USER ACTUALLY PULLS. The suite above tests the source; this
    # builds the container the action runs, and then drives it the way GitHub
    # does — `args: [action]`, `INPUT_*` in the environment, the workspace
    # mounted. Every input-mapping defect this project has had lived in the gap
    # between those two things.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t shard:ci .

      - name: Smoke-test through the real entry point
        run: |
          set -euo pipefail
          mkdir -p ws && printf 'def f(x):\n    return eval(x)\n' > ws/app.py
          docker run --rm \
            -v "$PWD/ws:/github/workspace" -w /github/workspace \
            -e INPUT_MODE=survey -e INPUT_OUT-DIR=/tmp/out \
            shard:ci action
