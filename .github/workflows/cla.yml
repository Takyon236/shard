# The Contributor Licence Agreement gate.
#
# ## Why this exists
#
# Shard is published under BUSL 1.1 and there is also a commercial edition that
# is not public. The two share code, so a contributed fix to a shared module may
# need to ship in both — and without an explicit grant from the contributor, that
# is not lawful. CLA.md is that grant. This workflow is what records it.
#
# ## Why `pull_request_target` here, and why that is safe in this one file
#
# The action needs to WRITE — it stores signatures in a file in this repository
# and posts a comment on the pull request — so it needs a token with more than
# read access. On a fork pull request, `pull_request` gets a read-only token, so
# the check could never pass for exactly the contributors it exists to serve.
#
# `pull_request_target` runs in the context of the BASE repository, with its
# secrets, which is normally dangerous: the usual mistake is to check out the
# fork's code and then run it. **This workflow never checks out any code.** It
# runs one published action against the pull request's metadata — author, commit
# list, comments — and nothing from the fork is executed or evaluated here.
#
# `permissions` grants THREE scopes, and each one is a call the pinned action actually makes. Read
# out of its source at `ca4a40a7`, not out of its README: `contents: write` is
# `repos.createOrUpdateFileContents` writing the signature file, `pull-requests: write` is
# `issues.{create,update,list}Comment` on the pull request, and `actions: write` is the single
# `actions.reRunWorkflow` call in `pullRerunRunner.ts` — reached only when everyone has signed, and
# it is what turns the red `cla` check green after a signature arrives by COMMENT, since an
# `issue_comment` run posts no check against the pull request's head.
#
# `statuses: write` was granted until 2026-09-02 and NOTHING USED IT. `createCommitStatus` appears
# once in the action's 1.18 MB bundle, in octokit's endpoint routing table, and at no call site; the
# check on the pull request is this job's own conclusion, which Actions reports without the scope.
# The line above claimed it "sets the check", which is the kind of sentence a reader trusts instead
# of the code. Dropping `actions: write` is NOT the same trade: the re-run is caught with
# `core.error`, so the job stays green and the pull request's check stays red, which is the
# merge-past-a-red-check habit the allowlist below was landed to avoid.
#
# THE THIRD-PARTY ACTION IS PINNED BY COMMIT, NOT BY TAG. This workflow runs on
# `pull_request_target` from any fork and hands it `secrets.GITHUB_TOKEN` with those three scopes, so
# a mutable `@v2.6.1` means whoever can move that tag can act on this repository with a token the
# fork never had to earn. A tag is a pointer its owner may repoint; a commit sha is the artefact.
# The version stays in a trailing comment so a reader still knows WHAT is pinned.

name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Only fire on the comment that signs, never on ordinary discussion — an
    # unfiltered `issue_comment` trigger runs this job on every comment in the
    # repository, which is noise and a small, needless use of a write token.
    if: >
      (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
      || github.event_name == 'pull_request_target'
    steps:
      - name: Check or record the signature
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/v1/cla.json'
          path-to-document: 'https://github.com/Takyon236/shard/blob/main/CLA.md'
          branch: 'main'
          # `shard-release` IS THIS PROJECT'S OWN RELEASE IDENTITY, not a contributor. Every commit
          # in this repository that was generated rather than written is authored by it — the whole
          # distribution is regenerated on each release — and there is no person behind it to sign
          # anything. Without this entry the CLA check is red on every release, which trains a
          # maintainer to merge past a red check; that is the same cost the CI retry was landed for,
          # one repository along.
          allowlist: 'dependabot[bot],github-actions[bot],shard-release'
          custom-notsigned-prcomment: >
            Thank you for the pull request.


            Shard shares code between this repository and a commercial edition
            that is not public, so a contribution may need to ship in both. The
            [CLA](https://github.com/Takyon236/shard/blob/main/CLA.md) is the
            grant that makes that lawful. It does **not** ask you to assign your
            copyright — you keep it, and you can relicense your own work to
            anyone else.


            Please read it, then post exactly this as a comment on this pull
            request:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: >
            All contributors have signed the CLA. Thank you.
